<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dukaan Dost</title>
<style>
  :root {
    /* Paytm palette. Every colour in the page and the chart comes from here, so one edit
       changes the theme. Nothing is downloaded: these are hex values and system fonts. */
    --navy:        #0B2559;   /* headings, the dark band, and all body text */
    --navy-deep:   #081B41;   /* the band's lower edge */
    --paytm-blue:  #00BAF2;   /* accents, rules, borders, the positive verdict */
    --sky:         #5FC8F5;   /* secondary accents */
    --sky-wash:    #E8F8FE;   /* tinted fills */
    --white:       #FFFFFF;
    --page:        #F4F6FA;   /* very light grey page */
    --card:        #FFFFFF;
    --line:        #DCE3EF;   /* borders, a navy tinted grey */
    --muted:       #5A6B8C;   /* secondary text, navy leaning, 5.3:1 on white */
    --faint:       #93A0B8;   /* struck through and held back text */

    /* These two carry meaning and stay as they were. */
    --amber:       #8A6D1F;   /* the silent night verdict */
    --amber-wash:  #FBF3DF;
    --red:         #A32020;   /* a campaign that measured below zero */

    /* Chart. Read by the SVG so the theme is defined in one place only. */
    --chart-grid:  #E1E7F2;
    --chart-zero:  #AAB6CC;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; padding: 22px 18px 70px;
    background: var(--page); color: var(--navy);
    font-family: "Segoe UI", Roboto, "Noto Sans Devanagari", system-ui, sans-serif;
    font-size: 17px; line-height: 1.5;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  /* The navy band. Same element, same order, just filled. */
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 14px;
           background: var(--navy); color: var(--white);
           border-bottom: 4px solid var(--paytm-blue);
           border-radius: 12px 12px 0 0;
           padding: 20px 22px; margin-bottom: 26px; }
  h1 { font-size: 30px; margin: 0; letter-spacing: -0.02em; color: var(--white);
       font-weight: 800; }
  .tagline { color: var(--sky); font-size: 16px; }
  .live { margin-left: auto; font-size: 13px; color: var(--sky); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
         background: var(--paytm-blue); margin-right: 6px; }

  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
            padding: 20px 22px; margin-bottom: 20px; }
  h2 { font-size: 13px; letter-spacing: 0.13em; text-transform: uppercase;
       color: var(--muted); margin: 0 0 16px; font-weight: 700; }
  h2 .n { color: var(--white); background: var(--navy); border: 1px solid var(--navy);
          border-radius: 5px; padding: 1px 7px; margin-right: 9px; }

  /* Rupee figures stay dark navy on light so they read from six feet. */
  .huge { font-size: 46px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05;
          font-variant-numeric: tabular-nums; color: var(--navy); }
  .big { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums;
         letter-spacing: -0.02em; color: var(--navy); }
  .sub { color: var(--muted); font-size: 15px; }
  .sentence { font-size: 20px; line-height: 1.5; margin: 0 0 10px; color: var(--navy); }
  .sentence b { font-variant-numeric: tabular-nums; }
  .hindi { font-size: 23px; line-height: 1.75; color: var(--navy); }

  .verdict { display: inline-block; font-size: 24px; font-weight: 800; letter-spacing: 0.02em;
             padding: 12px 20px; border-radius: 10px; margin-top: 6px; }
  /* Navy on Paytm blue is 6.4:1, so the positive verdict is blue and still readable. */
  .verdict.call { background: var(--paytm-blue); color: var(--navy);
                  border: 2px solid var(--paytm-blue); }
  .verdict.quiet { background: var(--amber-wash); color: var(--amber);
                   border: 2px solid var(--amber); }

  .signal { border-left: 4px solid var(--line); padding: 4px 0 4px 14px; margin-bottom: 14px; }
  .signal.full { border-left-color: var(--paytm-blue); }
  .signal .val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums;
                 color: var(--navy); }
  .signal .kind { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
                  color: var(--muted); }

  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted);
       text-align: right; padding: 6px 10px; font-weight: 700;
       border-bottom: 2px solid var(--paytm-blue); }
  th.left, td.left { text-align: left; }
  td { padding: 10px; border-bottom: 1px solid var(--line); text-align: right; font-size: 17px; }
  tr.refused td { color: var(--faint); }
  tr.refused .cand { text-decoration: line-through; }
  .cand { font-weight: 700; font-size: 17px; color: var(--navy); }
  .seg { display: block; font-size: 13px; color: var(--muted); font-weight: 400;
         text-decoration: none; }
  .cell { display: inline-block; padding: 5px 9px; border-radius: 7px; min-width: 76px; }
  .cell.chosen { background: var(--paytm-blue); color: var(--navy); font-weight: 800; }
  .cell.modelpick { outline: 2px dashed var(--sky); outline-offset: 1px; color: var(--navy);
                    font-weight: 700; }
  .cell.dead { color: var(--faint); }
  .why { font-size: 13px; color: var(--red); display: block; margin-top: 3px; }
  .legend { font-size: 13px; color: var(--muted); margin-top: 14px; }
  .legend .swatch { display: inline-block; padding: 2px 8px; border-radius: 5px; margin-right: 5px; }

  .msgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .msg { border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px;
         background: var(--white); border-left: 4px solid var(--paytm-blue); }
  .msg .who { font-size: 15px; font-weight: 700; letter-spacing: 0; text-transform: none;
              color: var(--navy); margin-bottom: 6px; }
  .msg .cid { font-size: 11px; font-weight: 400; letter-spacing: 0.06em; color: var(--muted);
              margin-left: 8px; }
  .msg.held { background: var(--page); border-style: dashed; border-left-color: var(--faint);
              color: var(--faint); }
  .msg.held .who { color: var(--faint); }
  .msg.held .cid { color: var(--faint); }
  .held-note { font-style: italic; }

  .stats { display: flex; flex-wrap: wrap; gap: 34px; align-items: flex-end; }
  .stat .k { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
             color: var(--muted); }
  .eq { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 14px;
        color: var(--navy); }
  .eq .op { color: var(--muted); font-weight: 400; padding: 0 8px; }

  .note { font-size: 15px; color: var(--muted); margin-top: 14px; }
  .empty { color: var(--muted); font-size: 18px; font-style: italic; }
  .pill { display: inline-block; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
          border: 1px solid var(--paytm-blue); border-radius: 20px; padding: 3px 11px;
          color: var(--muted); background: var(--sky-wash); }
  button { font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
           background: var(--white); border: 2px solid var(--paytm-blue); border-radius: 8px;
           padding: 10px 18px; color: var(--navy); }
  @media (max-width: 640px) { .huge { font-size: 34px; } body { font-size: 16px; } }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Dukaan Dost</h1>
    <span class="tagline" id="tagline">an autonomous growth analyst</span>
    <span class="live"><span class="dot"></span><span id="live">connecting...</span></span>
  </header>

  <section id="s1"><h2><span class="n">1</span>Tonight's decision</h2><div id="p1"></div></section>
  <section id="s2"><h2><span class="n">2</span>The reasoning trace</h2><div id="p2"></div></section>
  <section id="s3"><h2><span class="n">3</span>The call</h2><div id="p3"></div></section>
  <section id="s4"><h2><span class="n">4</span>Dispatch</h2><div id="p4"></div></section>
  <section id="s5"><h2><span class="n">5</span>Measurement</h2><div id="p5"></div></section>
  <section id="s6"><h2><span class="n">6</span>Learning</h2><div id="p6"></div></section>

</div>

<script>
"use strict";
var LEVELS = ["LOW", "MEDIUM", "HIGH"];
var el = function (id) { return document.getElementById(id); };

/* The chart is inline SVG, and an SVG fill attribute cannot take a CSS variable, so it
   reads them once from the stylesheet. The palette still lives in exactly one place. */
var THEME = getComputedStyle(document.documentElement);
function colour(name) { return THEME.getPropertyValue(name).trim(); }
var C = {
  navy: colour("--navy"),
  blue: colour("--paytm-blue"),
  sky: colour("--sky"),
  muted: colour("--muted"),
  red: colour("--red"),
  grid: colour("--chart-grid"),
  zero: colour("--chart-zero")
};

function esc(value) {
  if (value === null || value === undefined) { return ""; }
  return String(value).replace(/[&<>"']/g, function (c) {
    return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c];
  });
}
function rs(value, digits) {
  if (value === null || value === undefined || isNaN(value)) { return "n/a"; }
  return "Rs " + Number(value).toLocaleString("en-IN", {
    minimumFractionDigits: digits || 0, maximumFractionDigits: digits || 0});
}
function pct(value, digits) {
  if (value === null || value === undefined || isNaN(value)) { return "n/a"; }
  return (100 * Number(value)).toFixed(digits === undefined ? 1 : digits) + " percent";
}
function empty(message) { return '<p class="empty">' + esc(message) + "</p>"; }

/* 1. Tonight's decision ------------------------------------------------- */
function panelTonight(state) {
  var t = state.tonight, m = state.merchant;
  var html = '<p class="sentence"><b>' + esc(m.name) + "</b>, night of " + esc(m.today)
    + '. <span class="sub">' + rs(m.baseline.monthly_revenue) + " a month, "
    + m.baseline.active_customers + " customers active, " + m.baseline.regular_customers
    + " of them regulars.</span></p>";

  (t.signals || []).forEach(function (signal) {
    html += '<div class="signal' + (signal.counts_in_full ? " full" : "") + '">'
      + '<div class="kind">' + esc(signal.kind) + "</div>"
      + '<div class="sentence" style="margin:2px 0 4px">' + esc(signal.sentence) + "</div>"
      + '<div class="val">' + rs(signal.monthly_value) + ' <span class="sub">a month'
      + (signal.counts_in_full ? "" : ", discounted before it counts") + "</span></div></div>";
  });
  if (!(t.signals || []).length) { html += empty("No signal is outside this shop's own norm."); }

  html += '<div class="huge" style="margin-top:18px">' + rs(t.opportunity_score)
    + '</div><div class="sub">a month at stake, ' + pct(t.revenue_share, 0)
    + " of this shop's revenue. Threshold is " + rs(t.thresholds.min_monthly_rupees)
    + " and " + pct(t.thresholds.min_revenue_share, 0) + ".</div>";

  html += t.worth_a_call
    ? '<div class="verdict call">WORTH A CALL</div>'
    : '<div class="verdict quiet">NO CALL TONIGHT</div>'
      + '<p class="note">' + esc(t.silent_reason || "") + "</p>";
  return html;
}

/* 2. The reasoning trace ------------------------------------------------ */
function panelReasoning(state) {
  var r = state.reasoning;
  if (!r.grid.length) {
    return empty("No candidates tonight. Triage stopped before the model was ever asked, "
                 + "which is the whole cost argument.");
  }
  var html = '<p class="sub" style="margin-top:-6px">Candidates written by the '
    + esc(r.candidate_source === "llm" ? "language model" : "hand written placeholders")
    + ", priced at every depth by code.</p>";

  html += '<table><thead><tr><th class="left">candidate</th>';
  LEVELS.forEach(function (level) {
    html += "<th>" + level + " " + r.offer_levels[level] + " pc</th>";
  });
  html += "<th>outcome</th></tr></thead><tbody>";

  r.grid.forEach(function (row) {
    html += '<tr class="' + (row.accepted ? "" : "refused") + '">'
      + '<td class="left"><span class="cand">' + esc(row.title || row.candidate_id)
      + '</span><span class="seg">' + esc(row.action_type) + " to " + esc(row.segment)
      + "</span></td>";
    LEVELS.forEach(function (level) {
      var cell = row.levels[level] || {};
      var cls = "cell";
      if (row.accepted && row.chosen_level === level) { cls += " chosen"; }
      else if (!cell.survives) { cls += " dead"; }
      if (row.model_suggested_level === level) { cls += " modelpick"; }
      var value = cell.expected_profit;
      html += '<td><span class="' + cls + '">'
        + (value === undefined ? "n/a" : Number(value).toFixed(2))
        + (cell.survives ? "" : " x") + "</span></td>";
    });
    html += "<td>" + (row.accepted
      ? '<b style="color:var(--navy)">' + esc(row.chosen_level) + "</b>"
      : '<span style="color:var(--red)">refused</span>'
        + '<span class="why">' + esc(shortReason(row.rejections)) + "</span>") + "</td></tr>";
  });
  html += "</tbody></table>";

  html += '<p class="legend"><span class="swatch cell chosen">186.62</span> the level the '
    + "simulator chose";
  if (r.grid.some(function (row) { return row.model_suggested_level; })) {
    html += ' &nbsp; <span class="swatch cell modelpick">107.02</span> the level the model '
      + "preferred";
  } else {
    html += " &nbsp; the model no longer proposes a depth at all, so there is nothing of its "
      + "own to mark here";
  }
  html += ' &nbsp; <span class="swatch cell dead">-8.23 x</span> refused at that depth</p>';
  html += '<p class="sentence" style="margin-top:14px"><b>' + esc(r.note) + ".</b></p>";
  return html;
}

function shortReason(rejections) {
  var reasons = rejections || [];
  if (reasons.some(function (x) { return x.indexOf("margin floor") !== -1; })) {
    return "margin floor";
  }
  if (reasons.some(function (x) { return x.indexOf("discount budget") !== -1; })) {
    return "over the monthly discount budget";
  }
  if (reasons.some(function (x) { return x.indexOf("negative expected profit") !== -1; })) {
    return "negative profit at every depth";
  }
  return reasons.length ? reasons[0] : "";
}

/* 3. The call ----------------------------------------------------------- */
function panelCall(state) {
  var c = state.call;
  if (!c) { return empty("No call placed yet."); }
  var outcome = c.approved === true ? "APPROVED"
    : c.outcome === "declined" ? "DECLINED"
    : c.settled ? "UNDECIDED" : "WAITING FOR THE MERCHANT";
  var tone = c.approved === true ? "var(--navy)"
    : c.outcome === "declined" ? "var(--red)" : "var(--amber)";

  var html = '<div class="sub">what the agent said, in Hindi, every figure filled by code</div>'
    + '<p class="hindi">' + esc(c.script) + "</p>";
  if (c.audio_url) {
    html += '<button id="playback">Play the call</button> ';
  }
  html += '<span class="pill">' + esc(c.script_source) + " wrote the words</span>";
  html += '<div style="margin-top:20px"><div class="sub">what the merchant said</div>'
    + '<p class="hindi">' + esc(c.transcript || "nothing yet") + "</p></div>";
  html += '<div class="big" style="color:' + tone + '">' + outcome + "</div>";
  if (c.via) { html += '<div class="sub">answered by ' + esc(c.via) + "</div>"; }
  return html;
}

/* 4. Dispatch ----------------------------------------------------------- */
function panelDispatch(state) {
  var c = state.campaign;
  if (!c) { return empty("Nothing dispatched yet."); }
  var html = '<p class="sentence"><b>' + c.treated.length + " messaged</b>, <b>"
    + c.control.length + " deliberately held back</b>, at "
    + esc(c.discount_pct) + " percent off " + esc(c.offer_applies_to) + ".</p>";
  html += '<div class="msgs">';
  c.treated.forEach(function (row) {
    html += '<div class="msg"><div class="who">'
      + esc(row.customer_name || row.customer_id)
      + '<span class="cid">' + esc(row.customer_id) + "</span></div>"
      + '<div class="hindi" style="font-size:18px">' + esc(row.body) + "</div></div>";
  });
  c.control.forEach(function (row) {
    html += '<div class="msg held"><div class="who">'
      + esc(row.customer_name || row.customer_id)
      + '<span class="cid">' + esc(row.customer_id) + "</span> &middot; control</div>"
      + '<div class="held-note">no message, on purpose. This is how we know it was us.</div>'
      + "</div>";
  });
  html += "</div>";
  html += '<p class="note">' + esc(c.dispatch_note) + "</p>";
  return html;
}

/* 5. Measurement -------------------------------------------------------- */
function panelMeasure(state) {
  var c = state.campaign;
  var m = c && c.measurement;
  if (!m) { return empty("Not measured yet. The 72 hour wait has not finished."); }

  var html = '<div class="stats">'
    + stat("treated conversion", m.treated_returns + " of " + m.treated_n,
           pct(m.treated_rate, 0))
    + stat("control conversion", m.control_returns + " of " + m.control_n,
           pct(m.control_rate, 0))
    + "</div>";

  html += '<div class="eq">' + pct(m.treated_rate, 0) + '<span class="op">minus</span>'
    + pct(m.control_rate, 0) + '<span class="op">=</span>'
    + '<span style="color:' + (m.lift >= 0 ? "var(--navy)" : "var(--red)") + '">'
    + pct(m.lift, 0) + " lift</span></div>";

  html += '<div class="huge" style="margin-top:18px">' + rs(m.incremental_revenue)
    + '</div><div class="sub">incremental revenue recovered over '
    + c.horizon_days + " days, measured, not modelled</div>";
  html += '<p class="note">Lift is the subtraction above and nothing else. The control group '
    + "was never messaged, so whatever they did anyway is what the treated group would have "
    + "done anyway.</p>";
  return html;
}

function stat(key, value, sub) {
  return '<div class="stat"><div class="k">' + esc(key) + '</div><div class="big">'
    + esc(value) + '</div><div class="sub">' + esc(sub) + "</div></div>";
}

/* 6. Learning ----------------------------------------------------------- */
function panelLearning(state) {
  var l = state.learning;
  if (!l.series.length) {
    return empty("No campaign measured yet, so there is nothing to learn from.");
  }
  var html = chartSvg(l);
  html += '<p class="sentence" style="margin-top:16px"><b>' + esc(l.headline || "") + ".</b></p>";
  html += '<p class="note">The believed uplift is what the simulator predicts before each '
    + "campaign. The measured lift is what the holdout actually found, including campaign two "
    + "coming out negative because a two person control group can only produce nothing, half "
    + "or everything.</p>";
  return html;
}

function chartSvg(learning) {
  var series = learning.series;
  var W = 860, H = 340, L = 66, R = 24, T = 22, B = 52;
  var truth = learning.hidden_truth;

  var values = [];
  series.forEach(function (row) {
    if (row.predicted_uplift !== null) { values.push(row.predicted_uplift); }
    if (row.actual_uplift !== null) { values.push(row.actual_uplift); }
  });
  if (truth !== null && truth !== undefined) { values.push(truth); }
  var lo = Math.min.apply(null, values.concat([0]));
  var hi = Math.max.apply(null, values.concat([0.1]));
  var pad = (hi - lo) * 0.15 || 0.05;
  lo -= pad; hi += pad;

  var n = series.length;
  var x = function (i) { return L + (n === 1 ? (W - L - R) / 2 : (W - L - R) * i / (n - 1)); };
  var y = function (v) { return T + (H - T - B) * (1 - (v - lo) / (hi - lo)); };

  var svg = '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" role="img" '
    + 'aria-label="believed uplift climbing toward the hidden truth" '
    + 'style="max-width:100%;height:auto">';

  // horizontal guides
  [0, 0.1, 0.2, 0.3, 0.4].forEach(function (v) {
    if (v < lo || v > hi) { return; }
    svg += '<line x1="' + L + '" y1="' + y(v) + '" x2="' + (W - R) + '" y2="' + y(v)
      + '" stroke="' + C.grid + '" stroke-width="1"/>'
      + '<text x="' + (L - 10) + '" y="' + (y(v) + 5)
      + '" text-anchor="end" font-size="14" fill="' + C.muted + '">' + v.toFixed(2) + "</text>";
  });

  // zero line, so a negative measurement is obviously negative
  if (lo < 0 && hi > 0) {
    svg += '<line x1="' + L + '" y1="' + y(0) + '" x2="' + (W - R) + '" y2="' + y(0)
      + '" stroke="' + C.zero + '" stroke-width="2"/>';
  }

  // the hidden truth, a flat reference line
  if (truth !== null && truth !== undefined) {
    svg += '<line x1="' + L + '" y1="' + y(truth) + '" x2="' + (W - R) + '" y2="' + y(truth)
      + '" stroke="' + C.navy + '" stroke-width="2.5" stroke-dasharray="9 6"/>'
      + '<text x="' + (W - R) + '" y="' + (y(truth) - 10)
      + '" text-anchor="end" font-size="15" font-weight="700" fill="' + C.navy + '">'
      + "hidden truth " + truth.toFixed(2) + ", the agent never sees it</text>";
  }

  // measured lift per campaign, points only, nothing smoothed or hidden
  series.forEach(function (row, i) {
    if (row.actual_uplift === null || row.actual_uplift === undefined) { return; }
    var negative = row.actual_uplift < 0;
    svg += '<circle cx="' + x(i) + '" cy="' + y(row.actual_uplift) + '" r="7" fill="'
      + (negative ? C.red : C.sky) + '" stroke="' + C.navy + '" stroke-width="2"/>';
    if (negative) {
      svg += '<text x="' + x(i) + '" y="' + (y(row.actual_uplift) + 24)
        + '" text-anchor="middle" font-size="13" fill="' + C.red + '">measured below zero</text>';
    }
  });

  // believed uplift, the climbing line
  var path = series.map(function (row, i) {
    return (i ? "L" : "M") + x(i) + " " + y(row.predicted_uplift);
  }).join(" ");
  svg += '<path d="' + path + '" fill="none" stroke="' + C.blue + '" stroke-width="4" '
    + 'stroke-linejoin="round"/>';
  series.forEach(function (row, i) {
    svg += '<circle cx="' + x(i) + '" cy="' + y(row.predicted_uplift)
      + '" r="6" fill="' + C.blue + '"/>';
  });

  // campaign labels
  series.forEach(function (row, i) {
    svg += '<text x="' + x(i) + '" y="' + (H - B + 26)
      + '" text-anchor="middle" font-size="15" fill="' + C.muted + '">' + row.sequence
      + "</text>";
  });
  svg += '<text x="' + ((L + W - R) / 2) + '" y="' + (H - 8)
    + '" text-anchor="middle" font-size="14" fill="' + C.muted + '">campaign</text>';

  // legend
  svg += '<g font-size="15">'
    + '<circle cx="' + (L + 6) + '" cy="' + (T + 4) + '" r="6" fill="' + C.blue + '"/>'
    + '<text x="' + (L + 20) + '" y="' + (T + 9) + '" fill="' + C.navy
    + '">believed uplift</text>'
    + '<circle cx="' + (L + 190) + '" cy="' + (T + 4) + '" r="6" fill="' + C.sky
    + '" stroke="' + C.navy + '" stroke-width="2"/>'
    + '<text x="' + (L + 204) + '" y="' + (T + 9) + '" fill="' + C.navy
    + '">measured lift</text>'
    + "</g>";

  svg += "</svg>";
  return svg;
}

/* wiring ---------------------------------------------------------------- */
var lastAudio = null;

function render(state) {
  el("tagline").textContent = "an autonomous growth analyst for "
    + state.merchant.name + ", running every night";
  el("p1").innerHTML = panelTonight(state);
  el("p2").innerHTML = panelReasoning(state);
  el("p3").innerHTML = panelCall(state);
  el("p4").innerHTML = panelDispatch(state);
  el("p5").innerHTML = panelMeasure(state);
  el("p6").innerHTML = panelLearning(state);

  var button = el("playback");
  if (button && state.call && state.call.audio_url) {
    button.onclick = function () {
      if (lastAudio) { lastAudio.pause(); }
      lastAudio = new Audio(state.call.audio_url);
      lastAudio.play().catch(function () {
        button.textContent = "The browser blocked playback, press again";
      });
    };
  }
  el("live").textContent = "live, " + state.llm_mode + " mode, "
    + state.generated_at.split("T")[1];
}

function poll() {
  fetch("/dashboard/state")
    .then(function (response) {
      if (!response.ok) { throw new Error(response.status); }
      return response.json();
    })
    .then(function (state) {
      try { render(state); } catch (err) {
        el("live").textContent = "render error: " + err.message;
      }
    })
    .catch(function (err) { el("live").textContent = "waiting for the API (" + err.message + ")"; });
}

poll();
setInterval(poll, 2000);
</script>
